# Site override (GPU desktop): faster-whisper large-v3-turbo on CUDA fp16 —
# ~10x the appliance's small-int8 quality/speed budget. The defaults file
# keeps the CPU contract; delete this file to fall back.
version: 1
active: large-v3-turbo
device: cuda
compute_type: float16
# Power saving: free VRAM after 5 idle minutes so the GPU reaches its idle
# P-state; the next wake word reloads in ~1.4 s.
unload_after_s: 300
