# Blazen (user scope, activated via ALSA_CONFIG_PATH from the runtime audio
# profile — NEVER installed system-wide, so the desktop default is untouched).
# The Jabra SPEAK 410 advertises 8/16/48 kHz playback but its DAC clock never
# leaves 48 kHz: a 16 kHz source through plughw plays 3x fast. jabra_out pins
# the slave rate to 48 kHz so plug always resamples.
pcm.jabra_out {
    type plug
    slave {
        pcm {
            type hw
            card USB
            device 0
        }
        rate 48000
    }
}
