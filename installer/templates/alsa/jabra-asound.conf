# Blazen (user scope, activated via ALSA_CONFIG_PATH from the runtime audio
# profile — NEVER installed system-wide, so the desktop default is untouched).
# The Jabra SPEAK 410 advertises 8/16/48 kHz playback but its DAC clock never
# leaves 48 kHz: a 16 kHz source through plughw plays 3x fast. jabra_out pins
# the slave rate to 48 kHz so plug always resamples.
# jabra_out = plug (any rate in) → softvol (the ONLY volume the SPEAK 410 has
# on desktop kernels: its ALSA 'PCM' control is a bare mute switch, so
# "głośniej/ciszej" spun a knob that does not exist — 2026-08-29) → hw @48k.
# The 'Jessica' control appears on the card at first playback;
# blazen-audio-env instantiates it and sets a sane default. TTS speech
# (blazend-audio-out via cpal) deliberately bypasses it: her voice stays at
# a constant level, volume commands act on media.
pcm.jabra_out {
    type plug
    slave {
        pcm "jabra_sv"
        rate 48000
    }
}
pcm.jabra_sv {
    type softvol
    slave {
        pcm {
            type hw
            card USB
            device 0
        }
    }
    control {
        name "Jessica"
        card USB
    }
    min_dB -40.0
    max_dB 0.0
}
