# Blazen: release the Jabra SPEAK 410 from PipeWire so blazend-audio-in can
# capture it directly via plughw (PipeWire holding the card kills direct hw
# capture with POLLERR — see scripts/voice-run.sh). All other cards stay on
# PipeWire; desktop audio is unaffected. Installed by installer/install.sh.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*Jabra*" }
      { device.name = "~alsa_card.*0b0e*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
