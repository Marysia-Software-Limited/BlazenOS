[package]
name = "jessica-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI + JNI bridge that exposes jessica-core to iOS (cbindgen) and Android (jni-rs)."

# Three crate types so the same source ships to three consumers:
#   - staticlib → linked into JessicaFFI.xcframework (iOS device + simulator)
#   - cdylib    → libjessica_ffi.so under android/app/src/main/jniLibs/<abi>/
#   - rlib      → keeps `cargo test --workspace` happy
[lib]
name = "jessica_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
jessica-core = { path = "../jessica-core" }
serde       = { workspace = true }
serde_json  = { workspace = true }
libc        = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni        = { version = "0.21", default-features = false }

[build-dependencies]
# 0.29+ understands the Rust 2024 `#[unsafe(no_mangle)]` attribute form used
# in lib.rs; 0.27 silently skipped those fns, leaving the header without the
# `jessica_ffi_*` declarations the iOS/Swift seam needs.
cbindgen = "0.29"

[dev-dependencies]
serde_json = { workspace = true }
