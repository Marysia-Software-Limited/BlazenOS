[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rachel"
version = "0.0.1"
description = "rachel (macOS) audiobook agent — Calibre ingest + Apple/Azure TTS."
requires-python = ">=3.11"
dependencies = [
  "audiobook-catalog",
  "mesh-registry",
  "mesh-llm",
  "context-sync",
  "pyyaml>=6.0",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
azure = ["azure-cognitiveservices-speech>=1.38"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rachel-audiobook = "rachel.cli:main"
rachel-chat = "rachel.chat_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

# For `uv`/editable installs the shared domains lib is a path dependency. Plain
# `pip install -e .` expects it already installed (see macos/Makefile `venv`).
[tool.uv.sources]
audiobook-catalog = { path = "../../domains/audiobook-catalog", editable = true }
mesh-registry = { path = "../../domains/mesh-registry", editable = true }
mesh-llm = { path = "../../domains/mesh-llm", editable = true }
context-sync = { path = "../../domains/context-sync", editable = true }
