# /etc/blazen/asr.yaml

version: 1

# Pi 5 16 GB default: multilingual `medium` (better PL diacritics).
# Pi 5 8 GB downshifts to `small` (set in image build via
# BLAZEN_ASR_MODEL=small or by the engine selector on first boot).
# EN-only `small.en` is kept for the `lang_mode: en_only` build flavour.
# See docs/13-LANGUAGES.md and docs/05-MODELS.md.
active: small                          # 8 GB baked default (medium needs 16 GB + a separate download)
# Noise-floor gate for the post-wake capture window (below this i16 RMS the
# window is skipped, not transcribed — avoids whisper hallucinating on silence).
# TWO floors: `min_capture_rms` applies when idle (a clear command is ~400+, so
# this drops ambient false wakes ~100-200); `min_capture_rms_playing` applies
# while a stream plays (speaker-busy) — the Jabra's DSP attenuates the mic so a
# command over the ducked radio lands at ~50-120, needing a much lower floor.
min_capture_rms: 200
min_capture_rms_playing: 40
# Voice-memo dictation ("nagraj notatkę" — the orchestrator touches the
# memo-capture marker): record until `silence_s` of quiet after speech was
# heard, hard cap `max_s`; abort if nothing is said within `lead_in_s`. The
# memo is stored as BOTH the wav and its transcript (semantic memory DB).
memo_capture:
  max_s: 60
  silence_s: 1.5
  lead_in_s: 8
backend: faster-whisper
compute_type: int8                     # int8 | int8_float32 | float16 (Hailo path overrides)
device: cpu                            # cpu (appliance CONTRACT) | cuda (GPU desktop installs)
cpu_threads: 0                         # CPU decode threads; 0 = library default (4).
                                       # Raise on big desktops (paul: 8 → 2.7 s/4 s utterance
                                       # with large-v3-turbo int8); leave 0 on the 4-core Pi.
unload_after_s: 0                      # >0: drop the idle model after N s (GPU power saving;
                                       # reload ~1.4 s on a desktop GPU). 0 = never (appliance —
                                       # a Pi reload would cost ~20 s per command)
beam_size: 5                           # push-to-talk → one short utterance at a time, so the
                                       # extra beam-search cost is fine and accuracy matters more
language: pl                           # Polish-only mode: force PL (skips the auto-detect
                                       # first pass → faster + more accurate). auto | en | pl | de
# Domain prompt: biased the decoder toward the words Jessica hears. DISABLED —
# on low-SNR far-field audio whisper echoed the prompt words ("Zatrzymaj",
# "Przypomnij mi. Co potrafisz?") instead of the command, so it hurt more than it
# helped. Re-enable (a SHORT hint) only if the mic input is consistently clean.
initial_prompt: ""

# Domain lexicon (2026-08-27): the known vocabulary — intent trigger phrases,
# radio station names+aliases, news sources, audiobook titles/authors, music
# artist/album/track names — aggregated by asr/lexicon.py from the catalogs
# already on disk. Two independent uses:
#   correct:  post-ASR fuzzy repair of the finished transcript (difflib span
#             match, canonical spelling substituted only when CLOSE but not
#             exact). Safe everywhere — fixes real misreads like
#             "Dżesika, stop!" → "Jeszcze karp! Top!" — so ON by default.
#   hotwords: faster-whisper decoder bias (softer cousin of initial_prompt).
#             OFF by default for the same far-field echo reason as
#             initial_prompt above; enable in site asr.yaml on clean-mic
#             installs (paul: close Jabra + large-v3-turbo handles it).
lexicon:
  correct: true
  hotwords: false
  fuzzy_ratio: 0.78            # difflib ratio a span must clear to be repaired
  hotwords_max_chars: 120      # hotwords stay a short hint, not a dictionary

# Optional remote GPU whisper (scripts/whisper_server.py on the dev host with a
# GPU). When set, transcription is offloaded there — accurate + fast for the
# far-field path where whisper-small on the Pi CPU misreads real Polish — with a
# local fallback if unreachable. Set per-unit via BLAZEN_ASR_REMOTE_URL (a
# blazend-asr.service drop-in) so the appliance default stays fully on-device.
remote_url: ""                         # e.g. http://192.168.50.102:8090/transcribe
remote_timeout_s: 20
auto_detect:
  first_window_ms: 1000
  switch_threshold: 0.7
  fall_back_to_wake_hint: true

# Streaming partials.
streaming:
  partial_every_ms: 200
  max_segment_ms: 30000

# Selectable model variants. `make models` reads this for downloads.
# Pi 5 (8 GB) is the reference; sizes below are CPU-resident peaks.
models:
  tiny.en:
    download_id: Systran/faster-whisper-tiny.en
    size_mb: 75
    ram_mb: 400
    pi5_latency_5s_ms: 300
    license: MIT
  base.en:
    download_id: Systran/faster-whisper-base.en
    size_mb: 142
    ram_mb: 600
    pi5_latency_5s_ms: 500
    license: MIT
  small.en:
    download_id: Systran/faster-whisper-small.en
    size_mb: 466
    ram_mb: 1200
    pi5_latency_5s_ms: 700
    license: MIT
  medium.en:
    download_id: Systran/faster-whisper-medium.en
    size_mb: 1500
    ram_mb: 2700
    pi5_latency_5s_ms: 1500
    license: MIT
  small:                               # multilingual (default — incl. Polish)
    download_id: Systran/faster-whisper-small
    size_mb: 466
    ram_mb: 1200
    pi5_latency_5s_ms: 750
    languages: [pl, en, de, fr, es, it, pt, ru, ...]
    license: MIT
  medium:                              # multilingual, better PL diacritics
    download_id: Systran/faster-whisper-medium
    size_mb: 1500
    ram_mb: 2700
    pi5_latency_5s_ms: 1600
    languages: [pl, en, de, fr, es, it, pt, ru, ...]
    license: MIT
  large-v3-turbo:
    # The Systran mirror 404s (verified 2026-08-23); mobiuslabsgmbh is the
    # original CT2 conversion and downloads cleanly.
    download_id: mobiuslabsgmbh/faster-whisper-large-v3-turbo
    size_mb: 1600
    ram_mb: 3000
    pi5_latency_5s_ms: 1800
    languages: [pl, en, de, fr, es, it, pt, ru, ...]
    license: MIT

allowed:
  - small
  - medium
  - large-v3-turbo
  - small.en
  - tiny.en
  - base.en
  - medium.en

# Optional Hailo path for ASR. See docs/12-ML-ACCELERATOR.md.
# Whisper on Hailo is experimental as of 2026-01; faster-whisper CPU is the
# default and the Hailo path is opt-in only.
hailo:
  enabled: false
  variant: hailo-8                      # hailo-8 | hailo-8l | hailo-10h
  hef_path: /var/lib/blazen/hailo/asr/whisper-base.hef
  fallback_to_cpu_on_error: true
