# /etc/blazen/llm.yaml
#
# Two-engine design: a CPU fallback (llama.cpp) is ALWAYS available; an
# optional accelerator path (Hailo-10H, future ones) takes precedence
# when present. See docs/12-ML-ACCELERATOR.md for the rationale.

version: 1

active_engine: auto                      # auto | cpu | hailo
active_model: bielik-1.5b-v3-instruct-q4_k_m  # voice-mutable; Bielik (PL-first). 1.5B = ~2s/turn warm on 8GB CPU; 4.5B (~42s/turn) is the "larger brain" for 16GB/Hailo.

# Sampling.
temperature: 0.4
top_p: 0.9
top_k: 40
repeat_penalty: 1.1
seed: 0                                  # set in deterministic test runs
max_tokens_per_reply: 256

# Context / memory.
n_ctx: 4096
summarise_at_tokens: 3072
keep_last_turns: 8

system_prompt: |
  You are Jessica (casual: Jess; Polish vocative: Jessico), a voice-first
  personal assistant. You run on a Raspberry Pi 5 in the user's home.
  The user hears you through a speaker; they cannot see a screen.

  LANGUAGE: reply in the same language the user used (Polish or English;
  Polish is the primary language). If you can't tell, default to Polish.
  Keep replies short — one or two sentences unless the user asks for
  detail. The casual register is the default ("ok", "jasne", "robi się"
  / "sure", "got it") — switch to formal only on request.

  HONESTY: never invent tool outputs, source citations, or facts. If
  you don't know, say so plainly. If you used cloud info (Gemini) and
  the user asks "skąd to wiesz" / "source?", say it came from Gemini
  and offer to read citations.

  ROUTING: short factual questions you can answer with general
  knowledge — answer locally. Complex / multi-step questions, anything
  requiring up-to-date info, or anything the user phrased as "deep
  research" — escalate to Gemini per the routing rules in
  docs/product/04-CONVERSATION-MODES.md.

  IDENTITY: you are Jessica everywhere. Code-names like "blazen" or
  "rachel" are developer terms — never use them with the user.

  PRIVACY: when the user asks about cloud calls, what's stored, or
  what you know about them — read it back honestly per
  docs/product/08-PRIVACY-AND-CLOUD.md. Never lie about whether
  something went to the cloud.

# CPU engine via llama.cpp (always available — the fallback).
cpu:
  backend: llama-cpp-python
  threads: 4                             # Pi 5 cores
  n_batch: 256
  n_gpu_layers: 0                        # no GPU on Pi 5 main path
  use_mmap: true
  use_mlock: false
  flash_attn: false

# Optional accelerator engine. See docs/12-ML-ACCELERATOR.md for the
# install + tuning guide. Off by default; auto-enabled if hardware
# detected at boot.
hailo:
  enabled: false
  variant: hailo-10h                     # hailo-8 | hailo-8l | hailo-10h
  device_id: 0
  runtime: hailort                       # HailoRT >= 4.20
  precompiled_hef_dir: /var/lib/blazen/hailo/llm/
  swap_on_fail_to_cpu: true              # if Hailo path errors, fall back
  power_profile: balanced                # eco | balanced | performance

# Model catalogue. Each entry can be CPU-only, Hailo-only, or both.
# `make models` downloads the variants that match the chosen engines.
models:
  # Bielik (SpeakLeash) — Polish-specialised, built on Qwen2.5 so English is
  # retained. v3-small fits the 8 GB Pi 5; the 11B Polish leader needs 16 GB.
  # On Open PL LLM Leaderboard (Instruct, 5-shot): Bielik-4.5B 56.1 vs
  # Qwen2.5-3B 41.2; Bielik-1.5B 41.4 ≈ Qwen2.5-3B at half the size.
  bielik-4.5b-v3-instruct-q4_k_m:
    family: bielik
    parameters_b: 4.5
    cpu:
      file: Bielik-4.5B-v3.0-Instruct-Q4_K_M.gguf
      download_url: https://huggingface.co/second-state/Bielik-4.5B-v3.0-Instruct-GGUF/resolve/main/Bielik-4.5B-v3.0-Instruct-Q4_K_M.gguf
      sha256: "<TBD>"
      size_mb: 2880
      ram_mb: 3600
      pi5_cpu_ttft_ms: 450
      pi5_cpu_tok_s: 8
    license: Apache-2.0
