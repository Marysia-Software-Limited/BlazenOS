allowed:
  - bielik-4.5b-v3-instruct-q4_k_m
  - bielik-1.5b-v3-instruct-q4_k_m
  - qwen2.5-3b-instruct-q4_k_m
  - qwen2.5-7b-instruct-q4_k_m
  - qwen2.5-1.5b-instruct-q4_k_m
  - llama-3.2-3b-instruct-q4_k_m
  - phi-3.5-mini-instruct-q4_k_m
  - tinyllama-1.1b-q4_k_m

# Engine selection rules used by `active_engine: auto`.
auto_engine_rules:
  - if: hailo.detected and model.has_hailo_variant
    use: hailo
  - if: ram_free_mb < model.cpu.ram_mb + 800
    use: cpu_fallback                   # downshift to a smaller model
  - default: cpu

# Auto-downshift rules. Applied at boot if the requested model wouldn't
# fit. Keep the chain short so behaviour is predictable.
auto_downshift_chain:
  - bielik-4.5b-v3-instruct-q4_k_m
  - bielik-1.5b-v3-instruct-q4_k_m
  - qwen2.5-1.5b-instruct-q4_k_m
  - tinyllama-1.1b-q4_k_m

# Voice command "use the larger brain" / "użyj większego mózgu" promotes
# the active model up the chain by one step (only valid on Pi 5 16 GB
# and when free RAM permits). "use the smaller brain" / "użyj mniejszego
# mózgu" demotes it.
