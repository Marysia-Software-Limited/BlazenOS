# configs/mesh.yaml — the Jessica constellation registry.
#
# The "where" layer of the mesh: every node and the resources it advertises to
# the others (LLM / ASR / TTS endpoints). This generalizes the previously
# hard-coded peer URLs (Ollama :11434, whisper :8090, XTTS :8091) into one
# discoverable place so "share resources across nodes" is data, not scattered
# constants. Loaded via the shared domains/mesh-registry lib.
#
# Scope boundary: this is DISCOVERY (addresses + endpoints + capabilities).
# LLM routing *policy* (task -> backend order) stays in llm.yaml; that decides
# WHICH resource, this says WHERE it is. A node overrides `self` with $BLAZEN_NODE.
#
# See macos/docs/03-LLM-MESH.md and docs/19-DOMAIN-ARCHITECTURE.md.
version: 1

self: jessica            # who am I in the mesh (per-node override: $BLAZEN_NODE)

nodes:
  jessica:               # always-on Raspberry Pi 5 voice appliance
    role: appliance
    host: 192.168.50.24
    resources:
      llm:
        bielik-1.5b: { kind: llama-cpp, local: true, model: bielik-1.5b-v3-instruct-q4_k_m }
        bielik-4.5b: { kind: llama-cpp, local: true, model: bielik-4.5b-v3-instruct-q6_k }
      asr:
        whisper-local: { kind: faster-whisper, local: true, model: small }
      tts:
        piper-pl: { kind: piper, local: true }
      fabric:            # shared-context snapshot endpoint (context_sync)
        snapshot: { kind: fabric, url: "http://192.168.50.24:7475/fabric/snapshot" }

  paul:                  # Linux + RTX 3090 GPU / build rig
    role: gpu
    host: 192.168.50.102
    resources:
      # `unit:` = the systemd unit paul manages this service with (P4 fleet).
      llm:
        ollama-11b: { kind: openai, url: "http://192.168.50.102:11434", model: bielik-11b, unit: ollama.service }
      asr:
        whisper-remote: { kind: faster-whisper, url: "http://192.168.50.102:8090/transcribe", model: large-v3, unit: blazen-whisper.service }
      tts:
        xtts: { kind: xtts, url: "http://192.168.50.102:8091/synthesize", language: pl, speaker: "Ana Florence", unit: blazen-xtts.service }
      fabric:
        snapshot: { kind: fabric, url: "http://192.168.50.102:7475/fabric/snapshot" }
      health:            # aggregated fleet liveness so peers route around a down service
        fleet: { kind: fleet, url: "http://192.168.50.102:7476/fleet/health" }
      media:             # shared audiobook library (XTTS renders) — nodes stream chapters + catalog.json
        audiobooks: { kind: http, url: "http://192.168.50.102:7477/" }

  rachel:                # macOS Apple-Silicon desktop node
    role: desktop
    host: 192.168.50.186
    resources:
      llm:
        # MLX/Metal on the M3 Max (96 GB) — bigger Polish models than paul's 24 GB GPU.
        # See macos/docs/03-LLM-MESH.md "Which models rachel serves". Served by
        # org.blazen.mlx (mlx_lm.server, OpenAI-compatible). 11434 is the Mac's Ollama.
        mlx-bielik-11b: { kind: openai, url: "http://192.168.50.186:11435", model: "speakleash/Bielik-11B-v3.0-Instruct-MLX-8bit" }
        # Deep tier: the flagship Polish brain the 24 GB GPU can't host (~5.5 tok/s,
        # submit-and-wait — recommend / open_qa). ~42 GB resident; org.blazen.mlx-deep.
        mlx-qwen72b: { kind: openai, url: "http://192.168.50.186:11436", model: "mlx-community/Qwen2.5-72B-Instruct-4bit" }
      tts:
        apple-zosia-enhanced: { kind: apple, local: true, voice: "Zosia (Enhanced)" }
      fabric:
        snapshot: { kind: fabric, url: "http://192.168.50.186:7475/fabric/snapshot" }
