    tool: media.play

  - name: media_pause
    triggers:
      en:
        - "^(pause|stop playing)$"
      pl:
        - "^(pauza|wstrzymaj|zatrzymaj)$"
    action: media_transport
    transport: pause

  - name: media_resume
    triggers:
      en:
        - "^(resume|continue|play)$"
      pl:
        - "^(wzn(ó|o)w|kontynuuj|graj dalej)$"
