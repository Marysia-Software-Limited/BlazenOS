        - "(jess|jessica),? turn off (the )?hotspot"
      pl:
        - "(jess|jessico),? wy(ł|l)(ą|a)cz hotspot"
        - "(jess|jessico),? przesta(ń|n) udost(ę|e)pnia(ć|c) internet"
    action: tool_call
    tool: fabric.stop_share_internet

  - name: fabric_use_pi_brain
    triggers:
      en:
        - "(jess|jessica),? use (the )?pi('s)? brain"
        - "(jess|jessica),? route (llm|brain) to (the )?pi"
      pl:
        - "(jess|jessico),? u(ż|z)ywaj m(ó|o)zgu (na |z )?pi"
        - "(jess|jessico),? prze(ł|l)(ą|a)cz m(ó|o)zg na pi"
    action: mutate
    mutate:
      key: fabric.compute_preference.llm
      value: appliance

  - name: fabric_use_local_brain
    triggers:
      en:
        - "(jess|jessica),? use (the )?local brain"
        - "(jess|jessica),? route (llm|brain) to (this|me|the phone)"
      pl:
        - "(jess|jessico),? u(ż|z)ywaj lokalnego m(ó|o)zgu"
        - "(jess|jessico),? m(ó|o)zg na (telefon|to urz(ą|a)dzenie)"
    action: mutate
    mutate:
      key: fabric.compute_preference.llm
      value: local

  - name: fabric_route_speaker
    triggers:
      en:
        - "(jess|jessica),? on (the )?(kitchen )?speaker"
      pl:
        - "(jess|jessico),? na (g(ł|l)o(ś|s)niku|kuchennym g(ł|l)o(ś|s)niku)"
    action: tool_call
    tool: fabric.route_audio

  - name: fabric_route_buds
    triggers:
      en:
        - "(jess|jessica),? in (my )?(ear|headphones|buds|airpods)"
      pl:
        - "(jess|jessico),? na (s(ł|l)uchawki|airpods|do ucha)"
    action: tool_call
    tool: fabric.route_audio

  - name: fabric_show_on_tablet
    triggers:
      en:
        - "(jess|jessica),? show (it |that |this )?on (the )?(tablet|ipad|screen)"
      pl:
        - "(jess|jessico),? poka(ż|z) (to |mi )?na (tablecie|ipadzie|ekranie)"
    action: tool_call
    tool: fabric.route_display

  # Capabilities / help — Jessica explains what she can do (Polish-first). The
  # fast-path gives an instant summary; follow-up "how does X work?" questions
  # fall through to the brain, whose system prompt also lists these functions.
  - name: what_can_you_do
    triggers:
      pl:
        - "co (potrafisz|umiesz|robisz|mo(ż|z)esz (zrobi(ć|c)|dla mnie zrobi(ć|c)))"
        - "w czym (mo(ż|z)esz|mi) pomo(ż|z)esz"
        - "jakie masz (funkcje|mo(ż|z)liwo(ś|s)ci)"
        - "do czego s(ł|l)u(ż|z)ysz"
        - "^(pomoc|pomó(ż|z) mi)$"
      en:
        - "what can you do"
        - "what are your (functions|capabilities|features)"
        - "how can you help( me)?"
        - "what do you do"
        - "^help$"
    action: say
    response:
      pl: >-
        Jestem Jessica, twój głosowy asystent. Potrafię budzić się na „Hej
        Jessico", rozmawiać po polsku i angielsku, sprawdzać wiadomości i strony
        przez Gemini, oraz zapamiętywać notatki i przypomnienia. Powiedz na
        przykład „przypomnij mi o spotkaniu o piątej" albo „co nowego w
        wiadomościach". Zapytaj o szczegóły dowolnej funkcji, a wyjaśnię.
      en: >-
        I'm Jessica, your voice assistant. I can wake on "Hey Jessica", chat in
        Polish and English, check the news and websites via Gemini, and remember
        notes and reminders. Try "remind me about my meeting at five" or "what's
        new in the news". Ask me about any function and I'll explain.

  # --- Phase 4d: commands the Rust mind dispatches to the Python tool server.
  # `tool:` mirrors jessica_core::dispatch; slot groups (place / query) ride
  # nlu.intent params. Ported from the old engine's command regexes.
  - name: weather_query
    triggers:
      pl:
        - "pogod\\w*.*\\b(?:w|we)\\s+(?P<place>[a-ząćęłńóśźż'’\\- ]+?)\\s*$"
        - "pogod\\w*|jaka (jest )?aura|czy (b(ę|e)dzie )?pad\\w*|temperatur\\w*"
      en:
        - "(?:weather|forecast|temperatur\\w*).*\\bin\\s+(?P<place>[a-z'’\\- ]+?)\\s*$"
        - "weather|forecast|temperatur\\w*|is it (going to )?(rain|snow)"
    action: tool_call
    tool: weather.query

  - name: news_brief
    triggers:
      pl:
        - "wiadomo(ś|s)\\w*|co (nowego|s(ł|l)ycha(ć|c))|aktualno(ś|s)\\w*"
      en:
        - "news|headlines|what'?s happening"
    action: tool_call
    tool: news.brief

  - name: list_notes
    triggers:
      pl:
        - "co (pami(ę|e)tasz|zapami(ę|e)ta(ł|l)a(ś|s)?)|jakie mam notatki|moje notatki"
      en:
        - "what do you remember|list notes|my notes"
    action: tool_call
    tool: context.recall

  - name: list_reminders
    triggers:
      pl:
        - "jakie mam (przypomnienia|alarmy)|moje (przypomnienia|alarmy)|co mam (zaplanowane|na dzi(ś|s))"
      en:
        - "list (reminders|alarms)|what (reminders|alarms)|my (reminders|alarms)|what do i have planned"
    action: tool_call
    tool: context.recall_reminders

  - name: set_name
    triggers:
      pl:
        - "(?:nazywam si(ę|e)|mam na imi(ę|e)|m(ó|o)w do mnie)\\s+(?P<name>[a-ząćęłńóśźż'’\\-]+)"
      en:
        - "(?:my name is|call me)\\s+(?P<name>[a-z'’\\-]+)"
    action: tool_call
    tool: context.set_name

  - name: remember_note
    triggers:
      pl:
        - "(?:zapami(ę|e)taj|zapisz)\\s+(?:(?:że|ze|to|:|,)\\s+)?(?P<text>.+)"
      en:
        - "remember\\s+(?:that\\s+)?(?P<text>.+)"
    action: tool_call
    tool: context.remember

  - name: add_reminder
    triggers:
      pl:
        - "(?:przypomnij(?: mi)?|(?:ustaw|nastaw) (?:alarm|budzik)|dodaj (?:wydarzenie|spotkanie))\\s+(?P<text>.+)"
      en:
        - "(?:remind me|set (?:an? )?(?:alarm|timer|reminder)|wake me(?: up)?|add (?:an? )?(?:event|meeting))\\s+(?P<text>.+)"
    action: tool_call
    tool: context.add_reminder

  # AUDIOBOOKS (offline) — listed first; keyed on książka/audiobook/lektura so it
  # wins over music/radio. "włącz/przeczytaj/znajdź/puść książkę <tytuł/autor>".
  - name: audiobook_play
    triggers:
      pl:
        - "\\b(w(ł|l)(ą|a)cz|przeczytaj|czytaj|pu(ś|s)(ć|c)|znajd(ź|z)|szukaj|otw(ó|o)rz)\\b.*\\b(ksi(ą|a)(ż|z)k\\w*|audiobook\\w*|lektur\\w*|powie(ś|s)(ć|c)\\w*|s(ł|l)uchowisk\\w*)\\b\\s*(?P<query>.*)"
      en:
        - "\\b(play|read|open|find|search)\\b.*\\b(audiobook|book)\\b\\s*(?P<query>.*)"
    action: tool_call
    tool: audiobook.play

  # MUSIC (offline local library) — listed BEFORE radio_play. "zagraj X" is the
  # unambiguous music verb; "puść/graj MUZYKĘ/piosenkę X" also music; "zagraj coś"
  # → random. The query resolves against the on-device music index (artist/title/
  # album). Radio keeps "włącz/puść RADIO/<station>" (below), so they don't clash.
  - name: music_play
    triggers:
      pl:
        - "\\bzagraj\\b\\s+(?P<query>[\\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ].*)"
        - "\\b(pu(ś|s)(ć|c)|w(ł|l)(ą|a)cz|graj|pos(ł|l)uchaj\\w*)\\b.*\\b(muzyk\\w*|piosenk\\w*|utw(ó|o)r\\w*|kaw(a|ą)(ł|l)\\w*|album\\w*|p(ł|l)yt\\w*|nagran\\w*)\\b\\s*(?P<query>.*)"
        - "\\b(zagraj|pu(ś|s)(ć|c))\\s+co(ś|s)\\b"
      en:
        - "\\bplay\\b\\s+(?:some\\s+)?(?:music|a song|track)?\\s*(?P<query>.*)"
    action: tool_call
    tool: music.play

  - name: radio_play
    triggers:
      pl:
        # PLAY verb + "radio" → capture the REST as the station query (resolved
        # against radio.yaml aliases — every station works: kraków, 357, …).
        - "\\b(w(ł|l)(ą|a)cz|pu(ś|s)(ć|c)|nastaw)\\b.*\\bradi[ao]\\b(?:\\s+(?P<query>[\\wąćęłńóśźżĄĆĘŁŃÓŚŹŻ].*))?"
        # bare station name after a play verb (the common Polish channels)
        - "\\b(w(ł|l)(ą|a)cz|pu(ś|s)(ć|c)|nastaw)\\b\\s+(?P<query>tr(ó|o)jk\\w*|jedynk\\w*|dw(ó|o)jk\\w*|czw(ó|o)rk\\w*|rmf\\w*|nowy (ś|s)wiat\\w*|krak(ó|o)w\\w*|kultur\\w*|357|off)\\b.*"
      en:
        - "play (the )?(?P<query>radio|rmf|[a-z0-9 ]+? (radio|station|fm))"
        - "(turn on|put on) (the )?radio(?:\\s+(?P<query>[a-z0-9 ]+))?"
    action: tool_call
    tool: radio.play

  - name: radio_stop
    triggers:
      pl:
        - "(wy(ł|l)(ą|a)cz|zatrzymaj|zga(ś|s)|przesta(ń|n)).*(radio|muzyk\\w*|stacj\\w*|gra\\w*)"
        # bare stop verbs anywhere in the utterance (the transcript keeps the
        # "Jessica," wake prefix, so these must NOT be anchored to start/end).
        - "\\b(stop|zatrzymaj|przesta(ń|n)|zga(ś|s)|cisza|pauza|wy(ł|l)(ą|a)cz)\\b"
      en:
        - "(stop|turn off|pause).*(radio|music|station|playing)"
        - "\\b(stop|quiet|silence|pause|enough)\\b"
    action: tool_call
    tool: radio.stop
