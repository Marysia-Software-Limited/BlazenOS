# /etc/blazen/intents/system.yaml
#
# Fast-path intents (regex / keyword) handled before the LLM. Every
# intent carries per-language trigger lists; the matcher tries the
# detected language first, then the other. See docs/13-LANGUAGES.md.

version: 1

intents:
  - name: wake_ack
    triggers:
      en:
        - "^(yes|here|listening)$"
      pl:
        - "^(tak|s(ł|l)ucham|jestem|tu)$"
    action: noop

  - name: stop_talking
    triggers:
      en:
        - "^(stop|quiet|shut up|enough|cancel)$"
        - "stop talking"
      pl:
        - "^(stop|cicho|zamknij si(ę|e)|wystarczy|anuluj|przesta(ń|n))$"
        - "przesta(ń|n) m(ó|o)wi(ć|c)"
    action: tts_interrupt

  - name: repeat_last
    triggers:
      en:
        - "^(repeat|say again|what)$"
        - "say (that|it) again"
      pl:
        - "^(powt(ó|o)rz|jeszcze raz|co)$"
        - "powt(ó|o)rz to"
    action: replay_last_reply

  - name: volume_up
    triggers:
      en:
        - "(volume|louder) (up|higher)?"
        - "louder"
      pl:
        - "g(ł|l)o(ś|s)niej"
        - "podg(ł|l)o(ś|s)nij"
        - "zr(ó|o)b g(ł|l)o(ś|s)niej"
    action: mutate
    mutate:
      key: audio.volume
      delta: +10

  - name: volume_down
    triggers:
      en:
        - "(volume|quieter) (down|lower)?"
        - "(quieter|softer)"
      pl:
        - "ciszej"
        - "(przy|ś)cisz(yj)?"
        - "zr(ó|o)b ciszej"
    action: mutate
    mutate:
      key: audio.volume
      delta: -10

  - name: volume_set
    triggers:
      en:
        - "set (the )?volume (to )?(?P<value>\\d{1,3})( percent)?"
      pl:
        - "ustaw (g(ł|l)o(ś|s)no(ś|s)(ć|c) na )?(?P<value>\\d{1,3})( procent)?"
        - "g(ł|l)o(ś|s)no(ś|s)(ć|c) (na )?(?P<value>\\d{1,3})"
    action: mutate
    mutate:
      key: audio.volume
      value_from_group: value

  - name: what_time
    triggers:
      en:
        - "what(?:'s| is) the time"
        - "what time is it"
      pl:
        - "kt(ó|o)ra (jest )?godzina"
        - "jaka jest godzina"
    action: tool_call
    tool: clock.time

  - name: what_date
    triggers:
      en:
        - "what(?:'s| is) (the )?date"
        - "what day is (it|today)"
      pl:
        - "jaka jest (dzisiaj )?data"
        - "kt(ó|o)ry mamy dzie(ń|n)"
    action: tool_call
    tool: clock.date

  - name: go_to_sleep
    triggers:
      en:
        - "go to sleep"
        - "(stop|stop) listening"
      pl:
        - "(id(ź|z) )?spa(ć|c)"
        - "przesta(ń|n) s(ł|l)ucha(ć|c)"
    action: orchestrator_sleep

  - name: wake_up
    triggers:
      en:
        - "wake up"
        - "start listening"
      pl:
        - "obud(ź|z) si(ę|e)"
        - "zacznij s(ł|l)ucha(ć|c)"
    action: orchestrator_resume

  - name: reboot
    triggers:
      en:
        - "reboot( the system)?"
        - "restart yourself"
      pl:
        - "(z)?restartuj( si(ę|e))?"
        - "uruchom (si(ę|e) )?ponownie"
    action: mutate
    mutate:
      key: system.power.reboot
      value: true

  - name: shutdown
    triggers:
      en:
        - "shut down( the system)?"
        - "power off"
      pl:
        - "wy(ł|l)(ą|a)cz si(ę|e)"
        - "wy(ł|l)(ą|a)cz system"
    action: mutate
    mutate:
      key: system.power.shutdown
      value: true

  - name: enable_ssh
    triggers:
      en:
        - "enable ssh"
      pl:
        - "w(ł|l)(ą|a)cz ssh"
    action: mutate
    mutate:
      key: ssh.enabled
      value: true

  - name: disable_ssh
    triggers:
      en:
        - "disable ssh"
      pl:
        - "wy(ł|l)(ą|a)cz ssh"
    action: mutate
    mutate:
      key: ssh.enabled
      value: false

  - name: switch_voice
    triggers:
      en:
        - "use (the )?(?P<voice>\\S+) voice"
        - "change (the )?voice to (?P<voice>\\S+)"
      pl:
        - "u(ż|z)yj g(ł|l)osu (?P<voice>\\S+)"
        - "zmie(ń|n) g(ł|l)os na (?P<voice>\\S+)"
    action: mutate
    mutate:
      key: tts.active_voice
      value_from_group: voice

  - name: switch_language
    triggers:
      en:
        - "speak (?P<lang>polish|english|german|french|spanish)"
        - "switch to (?P<lang>polish|english|german|french|spanish)"
      pl:
        - "m(ó|o)w po (?P<lang>polsku|angielsku|niemiecku|francusku|hiszpa(ń|n)sku)"
        - "prze(ł|l)(ą|a)cz na (?P<lang>polski|angielski|niemiecki|francuski|hiszpa(ń|n)ski)"
    action: switch_language

  - name: detect_language
    triggers:
      en:
        - "detect (my )?language"
        - "auto language"
      pl:
        - "s(ł|l)uchaj uwa(ż|z)nie"
        - "auto(matycznie)? (wykryj )?j(ę|e)zyk"
    action: unpin_language

  - name: list_languages
    triggers:
      en:
        - "what language(s)? can you speak"
        - "what languages do you support"
      pl:
        - "jakie znasz j(ę|e)zyki"
        - "w jakich j(ę|e)zykach m(ó|o)wisz"
    action: tool_call
    tool: languages.list

  - name: apply_change
    triggers:
      en:
        - "^apply change(s)?$"
        - "^confirm$"
      pl:
        - "^potwierdzam$"
        - "^zatwierd(ź|z)( zmian(ę|e))?$"
        - "^wykonaj$"
    action: confirm_loud

  - name: cancel_change
    triggers:
      en:
        - "^never mind$"
        - "^cancel( that)?$"
      pl:
        - "^anuluj$"
        - "^nie( wa(ż|z)ne)?$"
        - "^zostaw$"
    action: cancel_pending

