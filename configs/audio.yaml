# /etc/blazen/audio.yaml — mostly voice-mutable.

version: 1

input:
  device: default                     # ALSA name; reference HW = ReSpeaker 2-Mics Pi HAT
                                      # (WM8960 codec @ i2c 0x1a, overlay wm8960-soundcard,
                                      # ALSA card "wm8960soundcard"); USB mic fallback
  sample_rate_hz: 16000
  channels: 1                         # ASR-facing mono; the HAT captures 2 mics, downmixed upstream
  frame_ms: 20
  ring_buffer_seconds: 3
  pre_roll_ms: 500

  # Energy VAD in blazend-audio-in brackets utterances for the ASR. It is
  # self-calibrating: it learns the ambient noise floor and scales the
  # thresholds off it — `effective_open = max(open_rms, noise_floor*open_mult)`.
  # `*_rms` are absolute floors (safety net); `*_mult` add headroom above
  # whatever the room actually is, so it works without per-install tuning.
  # Mirror the blazend-audio-in CLI flags (--open-rms, --open-mult, …).
  vad:
    open_rms: 1800                    # absolute floor for speech-start
    close_rms: 1100                   # absolute floor for silence
    open_mult: 2.5                    # speech-start = ambient × this (min open_rms)
    close_mult: 1.6                   # silence = ambient × this (min close_rms)
    hangover_ms: 300                  # trailing silence before vad.end
    min_speech_ms: 150                # minimum speech before vad.start

output:
  device: default
  sample_rate_hz: 22050
  channels: 1
  ducking_db: -12                     # when wake fires, duck the rest by 12 dB

processing:
  agc_enabled: true
  aec_enabled: true                   # WebRTC apm
  noise_suppression: moderate         # off | low | moderate | high

volume:
  default: 50                         # 0..100
  step: 10
  voice_mutable: true                 # see voice-policy.yaml

earcons:
  wake_chime: true
  error_tone: true
  shutdown_tone: true
  custom_voice_marker: false
