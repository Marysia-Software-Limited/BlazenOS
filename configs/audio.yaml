# /etc/blazen/audio.yaml — mostly voice-mutable.

version: 1

input:
  device: plughw:CARD=wm8960soundcard,DEV=0   # ReSpeaker 2-Mics Pi HAT (WM8960
                                      # codec @ i2c 0x1a, overlay wm8960-soundcard).
                                      # blazen-hat-mixer enables the PGA→ADC path
                                      # + sets +30 dB; without that the mics read
                                      # ~100× too quiet. USB mic = override device.
  sample_rate_hz: 16000
  channels: 1                         # ASR-facing mono; the HAT captures 2 mics, downmixed upstream
  frame_ms: 20
  ring_buffer_seconds: 3
  pre_roll_ms: 500
  high_pass_hz: 180                   # 2nd-order HP before ring+VAD; kills 50 Hz mains hum

  # Energy VAD in blazend-audio-in brackets utterances for the ASR. On the
  # WM8960 HAT the resting floor is high but STABLE (~4-6k) — but only because
  # blazend-audio-in runs at real-time priority on a dedicated core (CPU0); under
  # CPU contention the capture xruns and the floor spikes into the speech band.
  # Near-field speech reads ~18k, so FIXED thresholds (mult 1.0, no adaptive
  # inflation) cleanly separate them. Mirror the blazend-audio-in CLI flags.
  # Re-tune together with the +30 dB capture gain in blazen-hat-mixer.sh.
  vad:
    open_rms: 9000                    # speech-start (loud near-field ~18k clears it)
    close_rms: 6000                   # silence (resting floor ~4-6k sits below it)
    open_mult: 1.0                    # fixed thresholds — floor is stable via RT sched
    close_mult: 1.0
    hangover_ms: 700                  # trailing silence before vad.end
    min_speech_ms: 120                # minimum speech before vad.start
    max_speech_ms: 4000               # force-close cap so a noisy stretch can't starve ASR

output:
  device: vc4hdmi0                    # TEMPORARY: HDMI, no speaker on the ReSpeaker
                                      # HAT yet. Name-matched substring; falls back
                                      # to any working HDMI port. Input stays the HAT.
  sample_rate_hz: 22050               # Piper medium voices' native rate
  channels: 1
  ducking_db: -12                     # when wake fires, duck the rest by 12 dB

processing:
  agc_enabled: true
  aec_enabled: true                   # WebRTC apm
  noise_suppression: moderate         # off | low | moderate | high

volume:
  default: 50                         # 0..100
  step: 10
  voice_mutable: true                 # see voice-policy.yaml

earcons:
  wake_chime: true
  error_tone: true
  shutdown_tone: true
  custom_voice_marker: false
