# /etc/blazen/audio.yaml — mostly voice-mutable.

version: 1

input:
  device: plughw:CARD=USB,DEV=0       # Jabra SPEAK 410 USB speakerphone (mic).
                                      # Replaces the ReSpeaker 2-Mics HAT: a clean
                                      # USB-audio-class mic with onboard noise
                                      # reduction — no blazen-hat-mixer +30 dB hack.
                                      # Card id "USB" (stable for the 1st USB-audio
                                      # device); set capture (`Mic`) ≈ 6/7 to avoid
                                      # clipping loud near-field speech.
  sample_rate_hz: 16000
  channels: 1                         # ASR-facing mono (plughw resamples/downmixes)
  frame_ms: 20
  ring_buffer_seconds: 6            # >= capture_window_s (ASR fixed-window after wake)
  pre_roll_ms: 500
  high_pass_hz: 0                     # HP OFF: 180Hz HP stripped Polish vowel
                                      # fundamentals and whisper misread the audio.

  # Energy VAD in blazend-audio-in brackets utterances for the ASR. Measured on the
  # Jabra (2026-06-30, HP off): resting floor ~30 RMS; the mic captures the user's
  # voice low at normal distance, so thresholds sit close to the floor. Mirror the
  # blazend-audio-in CLI flags. NOTE: integration tuning still pending — the wake
  # model over-fires (floods ASR) and far-field SNR is marginal; speak near the mic.
  vad:
    open_rms: 80                      # speech-start (floor ~30; conversational speech is low)
    close_rms: 50                     # silence (close < open for hysteresis)
    open_mult: 1.0                    # fixed thresholds — adaptive floor tracking reads ~0
    close_mult: 1.0
    hangover_ms: 400                  # trailing silence before vad.end
    min_speech_ms: 150                # minimum speech before vad.start
    max_speech_ms: 1500               # force-close cap → ~command-length segments

output:
  device: USB                         # Jabra SPEAK 410 speakerphone (speaker). Same
                                      # device as input — the Jabra is mic + speaker.
                                      # Case-insensitive substring matched against the
                                      # cpal device name (Jabra enumerates as CARD=USB);
                                      # falls back to the default output if not found.
  sample_rate_hz: 22050               # Piper medium voices' native rate
  channels: 1
  ducking_db: -12                     # when wake fires, duck the rest by 12 dB

processing:
  agc_enabled: true
  aec_enabled: true                   # WebRTC apm
  noise_suppression: moderate         # off | low | moderate | high

volume:
  default: 30                         # 0..100 — kept low so speaker output bleeds
                                      # less into the Jabra mic. Matches the runtime
                                      # default enforced in code (dispatch.SettingsStore
                                      # _DEFAULTS + supervisor._DEFAULT_VOLUME_PCT).
  step: 10
  voice_mutable: true                 # see voice-policy.yaml

earcons:
  # ON again (2026-08-04, user request "I want to know the state by sound"):
  # the retrained wake model brought false wakes down to ~2/h, so the instant
  # "speak now" chime no longer chirps at the television. Strict flow
  # (wake → beep → listen), refractory and echo-suppression are all in place.
  wake_chime: true
  error_tone: true
  shutdown_tone: true
  custom_voice_marker: false
  # Spoken "Chwileczkę." when the answer will take a while (LLM generation or a
  # long reply's XTTS render) — announces the wait instead of dead air. One cue
  # per question (cooldown in the supervisor). Cue text: phrases.yaml cues.working.
  thinking: true
  # Processing heartbeat: a soft low tick every `processing_tick_s` seconds
  # while Jessica works in silence (post-wake capture + whisper, and again
  # during LLM generation) — the blind-first "still with you" signal. Never
  # ticks over playback or speech; "dżesika, stop" mid-wait cancels the turn
  # (heartbeat stops, the late LLM answer is dropped, spoken "Anuluję.").
  processing_tick: true
  processing_tick_s: 5

# Output dynamics in blazend-player (radio / music / audiobooks). The player
# measures its OWN output level and auto-holds a constant loudness, so a quiet
# Wolne Lektury audiobook (~-20 LUFS) comes up to the same real level as radio.
# See docs/07-CONFIGURATION.md.
leveling:                 # always-on loudness normalisation (ALL sources)
  enabled: true
  target_dbfs: -16        # boost/cut every source toward this output RMS
  max_boost_db: 20        # cap on how much a very quiet source is lifted
  limit_dbfs: -1          # brick-wall ceiling so leveling never clips

compression:              # speech intelligibility — books/podcasts ONLY, never music/radio
  enabled: true
  threshold_dbfs: -24     # above this, quiet/loud speech is evened out
  ratio: 3.0
  makeup_db: 3
