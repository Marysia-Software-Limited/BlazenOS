# /etc/blazen/wake-word.yaml

version: 1

# Bilingual prototype: two Jessica wake models loop in parallel. See
# docs/product/02-PERSONA-AND-WAKE.md + docs/13-LANGUAGES.md.
# The legacy `hey_blazen_*` models stay in the catalogue as developer
# wakes but are not active in release builds.
active:                                       # voice-mutable from `allowed` only
  - jessica_pl
  - jessica_en
threshold: 0.8                                # wake fires above this (the deployed
                                              # blazend-wake unit passes --threshold 0.8;
                                              # close "dżesika" ~0.8-0.99, other speech ≤0.36)
cooldown_ms: 500
score_window_ms: 1000

# Wake gating: Jessica only acts on speech heard within `conversation_window_s`
# after "dżesika" (each acted-on utterance re-opens the window for follow-ups).
# require_wake=true is REQUIRED on a real appliance: with it false she is always
# listening, so any ambient sentence can hit an intent (2026-07-10: a false wake +
# room chatter spontaneously started music). The window is short so a stray wake
# exposes little ambient time; a genuine command re-opens it for follow-ups.
require_wake: true
conversation_window_s: 8

# Hands-free capture (S5 `blazend.voice.runner`). After a wake fires and the
# acknowledgement plays, the runner records a FIXED window straight from the
# Rust audio ring — no energy VAD, because the quiet WM8960 HAT fragments
# short utterances. `capture_window_s` is that window length; the HAT button
# delimits its own (held) window instead. Env override: `BLAZEN_CAPTURE_S`.
capture_window_s: 4.5

# The Jessica wake is one **bilingual** model trained locally (openWakeWord
# melspectrogram+embedding front-end + a classifier head fit on Piper-synthesised
# clips PLUS the operator's own recorded "dżesika" utterances); `jessica_pl` and
# `jessica_en` both point at that single file. The wake WORD is the bare single
# word "dżesika" (Polish phonetic for Jessica) — the form the user actually
# speaks (decision 2026-06-30; see docs/13-LANGUAGES.md). Rhyming Polish names
# (Marysia/Kasia/Basia) are hard negatives. "Hej Dżesika" / "Hey Jessica" remain
# positives for robustness. Regenerate: `.venv-train/bin/python scripts/train-wake.py`
# (→ models/wake/jessica.onnx; pass --real-dir for the real recordings). Runtime
# pipeline: melspectrogram.onnx → embedding_model.onnx → jessica.onnx (the first
# two ship with openwakeword). Validated 9/9 held-out real utterances fire @0.5.
models:
  jessica_en:
    backend: openwakeword
    file: wake/jessica.onnx                   # under models/; gitignored, regen via train-wake.py
    trained_by: scripts/train-wake.py
    sha256: "5e378d64de6ea786725052b9d4ce63ec4b01fab953a68c8968637796b615c989"
    size_mb: 1
    language: en
    phrases: ["jessica", "hey jessica"]
    license: Apache-2.0
  jessica_pl:
    backend: openwakeword
    file: wake/jessica.onnx                   # same unified bilingual model
    trained_by: scripts/train-wake.py
    sha256: "5e378d64de6ea786725052b9d4ce63ec4b01fab953a68c8968637796b615c989"
    size_mb: 1
    language: pl
    phrases: ["dżesika"]
    license: Apache-2.0
  hey_blazen_en:
    backend: openwakeword
    file: hey_blazen_en.onnx
    download_url: https://blazen-os-assets/wake/hey_blazen_en-v1.onnx
    sha256: "<TBD>"
    size_mb: 4
    language: en
    phrase: "hey blazen"
    license: Apache-2.0
  hey_blazen_pl:
    backend: openwakeword
    file: hey_blazen_pl.onnx
    download_url: https://blazen-os-assets/wake/hey_blazen_pl-v1.onnx
    sha256: "<TBD>"
    size_mb: 4
    language: pl
    phrase: "hej blazen"
    license: Apache-2.0
  hey_jarvis:
    backend: openwakeword
    file: hey_jarvis_v0.1.onnx
    download_url: https://github.com/dscripka/openWakeWord/releases/download/v0.5.0/hey_jarvis_v0.1.onnx
    sha256: "<TBD>"
    size_mb: 4
    language: en
    phrase: "hey jarvis"
    license: Apache-2.0
  alexa:
    backend: openwakeword
    file: alexa_v0.1.onnx
    download_url: https://github.com/dscripka/openWakeWord/releases/download/v0.5.0/alexa_v0.1.onnx
    sha256: "<TBD>"
    size_mb: 4
    language: en
    phrase: "alexa"
    license: Apache-2.0

allowed:                                       # set in voice-policy.yaml; whitelist of switchable models
  - jessica_pl
  - jessica_en
  - hey_blazen_pl                              # developer wakes — kept for backwards compatibility
  - hey_blazen_en
  - hey_jarvis
  - alexa

button_fallback:
  enabled: false
  gpio_bcm: 26
  pull: up
  debounce_ms: 50
