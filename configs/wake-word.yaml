# /etc/blazen/wake-word.yaml

version: 1

# Bilingual prototype: two Jessica wake models loop in parallel. See
# docs/product/02-PERSONA-AND-WAKE.md + docs/13-LANGUAGES.md.
# The legacy `hey_blazen_*` models stay in the catalogue as developer
# wakes but are not active in release builds.
active:                                       # voice-mutable from `allowed` only
  - jessica_pl
  - jessica_en
threshold: 0.8                                # wake fires above this (the deployed
                                              # blazend-wake unit passes --threshold 0.8;
                                              # close "dżesika" ~0.8-0.99, other speech ≤0.36)
cooldown_ms: 500
score_window_ms: 1000

# Wake gating: Jessica only acts on speech heard within `conversation_window_s`
# after "dżesika" (each acted-on utterance re-opens the window for follow-ups).
# require_wake=true is REQUIRED on a real appliance: with it false she is always
# listening, so any ambient sentence can hit an intent (2026-07-10: a false wake +
# room chatter spontaneously started music). The window is short so a stray wake
# exposes little ambient time; a genuine command re-opens it for follow-ups.
require_wake: true
# Long enough that a slow transcript (remote ASR retry → local fallback can add
# several seconds) still lands inside the window — an 8 s window dropped commands
# as "asleep" when ASR lagged. Intent anchoring + require_wake keep ambient speech
# from matching, so a longer window is safe.
# 20 (was 15): measured 2026-08-21 — wake→asr.final ran 15-17 s when whisper was
# CPU-starved (tts crash-loop), and every command died as "asleep". 20 s keeps a
# loaded box inside the window; anchored intents + require_wake cover the risk.
conversation_window_s: 20

# Conversation mode (2026-08-30): after Jessica speaks an LLM chat reply she
# chimes softly and LISTENS for the answer — no wake word needed for the next
# turn (the follow-up capture is silence-terminated; quiet closes the
# exchange). The engine also carries the last `history_turns` chat exchanges
# to the LLM so the thread survives across turns; history clears when the
# conversation window expires.
conversation:
  followup: true
  history_turns: 6

# Hands-free capture (S5 `blazend.voice.runner`). After a wake fires and the
# acknowledgement plays, the runner records a FIXED window straight from the
# Rust audio ring — no energy VAD, because the quiet WM8960 HAT fragments
# short utterances. `capture_window_s` is that window length; the HAT button
# delimits its own (held) window instead. Env override: `BLAZEN_CAPTURE_S`.
capture_window_s: 4.5

# Self-harvesting wake negatives: when a wake fires but the capture window yields
# no command (below the level floor, or whisper found no words), save the window
# to /var/lib/blazen/wake-negatives/ (newest 200 kept, ~32 MB cap). Each clip IS
# the sound that fooled the wake model, recorded at the exact moment — feed the
# screened clips to `train-wake.py --neg-dir` so every false activation makes the
# next model stricter. Screen at retrain time (don't auto-ingest): a real but
# distant/quiet "dżesika" lands in the same branch. On-device only, never synced.
harvest_false_wakes: true

# The Jessica wake is one **bilingual** model trained locally (openWakeWord
# melspectrogram+embedding front-end + a classifier head fit on Piper-synthesised
# clips PLUS the operator's own recorded "dżesika" utterances); `jessica_pl` and
# `jessica_en` both point at that single file. The wake WORD is the bare single
# word "dżesika" (Polish phonetic for Jessica) — the form the user actually
# speaks (decision 2026-06-30; see docs/13-LANGUAGES.md). Rhyming Polish names
# (Marysia/Kasia/Basia) are hard negatives. "Hej Dżesika" / "Hey Jessica" remain
# positives for robustness. Regenerate: `.venv-train/bin/python scripts/train-wake.py`
# (→ models/wake/jessica.onnx; pass --real-dir for the real recordings). Runtime
# pipeline: melspectrogram.onnx → embedding_model.onnx → jessica.onnx (the first
# two ship with openwakeword). Retrained 2026-07-13 against the false-wake storm
# (~6 ambient wakes/min): --neg-dir now carries 460 real negatives — Radio Kraków
# stream clips PLUS the appliance room's own ambient recorded off the Jabra
# (`scripts/record-wake-samples.sh`), ×4 oversample. Retrained again 2026-07-13
# (2nd pass) with 193 SELF-HARVESTED false-wake clips (see harvest_false_wakes
# above; screened via GPU large-v3 transcription — zero wake-like content — and
# journal correlation, clips within ±2 min of real commands excluded) → 653 real
# negatives total. Retrained 2026-08-29 (paul room): +27 RADIO negatives —
# talk radio playing NEXT TO the appliance false-fired 0.70-0.97, overlapping
# real-wake scores, so thresholds could not separate them (speech-kind harvest
# in asr/__main__.py now feeds this loop automatically). Validated 2026-08-29:
# held-out real "dżesika" 9/9 at every thr 0.3-0.9; all 48 real positives pass
# 0.65 before AND after (zero sensitivity regressions); the radio clips that
# false-fired dropped 16/27 → 2/27. Retrained 2026-09-08 (paul): +71 screened
# harvest clips (a week of podcast/room-talk false wakes + a silent-room
# transient that scored 0.71 and started a radio) → 951 real negatives.
# Validated: held-out "dżesika" 9/9 at every thr 0.3-0.9; corpus false-fires
# at 0.65 dropped 4 → 2; the captured silence transient 0.33 → 0.22.
models:
  jessica_en:
    backend: openwakeword
    file: wake/jessica.onnx                   # under models/; gitignored, regen via train-wake.py
    trained_by: scripts/train-wake.py
    sha256: "9051314eff7ad2949e86b136d603647d8d21568aceba416e7a1ade827bf0a9fa"
    size_mb: 1
    language: en
    phrases: ["jessica", "hey jessica"]
    license: Apache-2.0
  jessica_pl:
    backend: openwakeword
    file: wake/jessica.onnx                   # same unified bilingual model
    trained_by: scripts/train-wake.py
    sha256: "9051314eff7ad2949e86b136d603647d8d21568aceba416e7a1ade827bf0a9fa"
    size_mb: 1
    language: pl
    phrases: ["dżesika"]
    license: Apache-2.0
  hey_blazen_en:
    backend: openwakeword
    file: hey_blazen_en.onnx
    download_url: https://blazen-os-assets/wake/hey_blazen_en-v1.onnx
    sha256: "<TBD>"
    size_mb: 4
    language: en
    phrase: "hey blazen"
    license: Apache-2.0
  hey_blazen_pl:
    backend: openwakeword
    file: hey_blazen_pl.onnx
    download_url: https://blazen-os-assets/wake/hey_blazen_pl-v1.onnx
    sha256: "<TBD>"
    size_mb: 4
    language: pl
    phrase: "hej blazen"
    license: Apache-2.0
  hey_jarvis:
    backend: openwakeword
    file: hey_jarvis_v0.1.onnx
    download_url: https://github.com/dscripka/openWakeWord/releases/download/v0.5.0/hey_jarvis_v0.1.onnx
    sha256: "<TBD>"
    size_mb: 4
    language: en
    phrase: "hey jarvis"
    license: Apache-2.0
  alexa:
    backend: openwakeword
    file: alexa_v0.1.onnx
    download_url: https://github.com/dscripka/openWakeWord/releases/download/v0.5.0/alexa_v0.1.onnx
    sha256: "<TBD>"
    size_mb: 4
    language: en
    phrase: "alexa"
    license: Apache-2.0

allowed:                                       # set in voice-policy.yaml; whitelist of switchable models
  - jessica_pl
  - jessica_en
  - hey_blazen_pl                              # developer wakes — kept for backwards compatibility
  - hey_blazen_en
  - hey_jarvis
  - alexa

button_fallback:
  enabled: false
  gpio_bcm: 26
  pull: up
  debounce_ms: 50
