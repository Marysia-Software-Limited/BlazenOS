# /etc/blazen/tts.yaml

version: 1

# Per-language defaults. The TTS engine keeps both voices warm in RAM and
# selects per utterance based on the detected reply language. See
# docs/13-LANGUAGES.md.
voice_by_language:
  pl: pl_PL-gosia-medium                # Jessica — Polish young-woman voice
  en: en_US-lessac-medium               # English — female

# Legacy single-default field — kept so older code paths still work and to
# pin a single voice when language detection is disabled.
active_voice: pl_PL-gosia-medium       # voice-mutable

backend: piper                          # only one for now
sample_rate_hz: 22050
length_scale: 1.0                       # speed; <1 = faster
noise_scale: 0.667
noise_w: 0.8
streaming_chunk_ms: 100

voices:
  en_US-lessac-medium:
    file: en_US-lessac-medium.onnx
    config_file: en_US-lessac-medium.onnx.json
    download_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
    config_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json
    sha256: "5efe09e69902187827af646e1a6e9d269dee769f9877d17b16b1b46eeaaf019f"
    size_mb: 61
    language: en
    license: MIT
  en_US-amy-medium:
    file: en_US-amy-medium.onnx
    download_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx
    sha256: "<TBD>"
    size_mb: 50
    language: en
    license: MIT
  pl_PL-darkman-medium:
    file: pl_PL-darkman-medium.onnx
    config_file: pl_PL-darkman-medium.onnx.json
    download_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/pl/pl_PL/darkman/medium/pl_PL-darkman-medium.onnx
    config_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/pl/pl_PL/darkman/medium/pl_PL-darkman-medium.onnx.json
    sha256: "<TBD>"
    size_mb: 50
    language: pl
    license: MIT
  pl_PL-gosia-medium:
    file: pl_PL-gosia-medium.onnx
    config_file: pl_PL-gosia-medium.onnx.json
    download_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/pl/pl_PL/gosia/medium/pl_PL-gosia-medium.onnx
    config_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/pl/pl_PL/gosia/medium/pl_PL-gosia-medium.onnx.json
    sha256: "38f66464240ed74f186e6b7dc13c6e3b22e023426299f25c2b3cc9dfa9373fbc"
    size_mb: 61
    language: pl
    license: MIT
  en_GB-alan-low:
    file: en_GB-alan-low.onnx
    download_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_GB/alan/low/en_GB-alan-low.onnx
    sha256: "<TBD>"
    size_mb: 30
    language: en
    license: MIT

allowed:
  - pl_PL-darkman-medium
  - pl_PL-gosia-medium
  - en_US-lessac-medium
  - en_US-amy-medium
  - en_GB-alan-low

# A small per-language pronunciation table — applied before synthesis so
# loanwords (SSH, Wi-Fi, ASR, LLM) don't trip the Polish prosody.
pronunciation_overrides:
  pl:
    SSH: "es-es-ha"
    "Wi-Fi": "wi-fi"
    ASR: "a-es-er"
    LLM: "el-el-em"
    HAT: "hat"
    Hailo: "hajlo"
  en:
    SSH: "S S H"
    Hailo: "hi-lo"

interrupt_on_intent:
  - stop_talking
  - cancel
