# project.yml — XcodeGen spec for the Jessica iOS app.
#
# Usage:
#   brew install xcodegen      # one-time
#   xcodegen generate          # produces Jessica.xcodeproj
#   open Jessica.xcodeproj     # or `make debug`

name: Jessica
options:
  bundleIdPrefix: os.blazen.jessica
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: pl

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
    TARGETED_DEVICE_FAMILY: "1,2"      # iPhone + iPad
    INFOPLIST_KEY_CFBundleDisplayName: Jessica

packages:
  JessicaCore:
    path: ./JessicaCore

targets:
  Jessica:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Jessica
        excludes:
          - Resources/Info.plist
    resources:
      - Jessica/Resources/Assets.xcassets
      - Jessica/Resources/intents-system.yaml
    info:
      path: Jessica/Resources/Info.plist
      properties:
        CFBundleDisplayName: Jessica
        CFBundleLocalizations: [pl, en]
        CFBundleDevelopmentRegion: pl
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - processing
          - fetch
        NSMicrophoneUsageDescription: >-
          Jessica listens for the wake word so you can talk to her
          without touching the screen.
        NSSpeechRecognitionUsageDescription: >-
          Jessica turns your speech into text on-device.
        NSPersonalVoiceUsageDescription: >-
          Jessica can use your Personal Voice for a more natural
          conversation experience.
    dependencies:
      - package: JessicaCore
        product: JessicaCore

  JessicaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: JessicaTests
    dependencies:
      - target: Jessica
      - package: JessicaCore
        product: JessicaCore

schemes:
  Jessica:
    build:
      targets:
        Jessica: all
        JessicaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JessicaTests
    profile:
      config: Release
    archive:
      config: Release
