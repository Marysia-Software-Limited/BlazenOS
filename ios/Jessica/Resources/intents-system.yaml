# Bootstrap intent catalogue shipped with the app. Mirrors
# blazen_os/configs/intents/system.yaml; the canonical set is loaded
# at runtime from the synced fabric profile on first pair.
#
# Kept in lockstep with android/app/src/main/assets/intents-system.yaml —
# both bundles must list the same intent names so the cross-platform
# spec stays honest.
version: 1
intents:
  - name: volume_up
    triggers:
      en: ["louder", "turn it up", "volume up"]
      pl: ["g(ł|l)o(ś|s)niej", "podg(ł|l)o(ś|s)"]
    action: mutate
  - name: volume_down
    triggers:
      en: ["quieter", "turn it down", "volume down"]
      pl: ["ci(sz|sz)ej", "(ś|s)cisz"]
    action: mutate
  - name: time_query
    triggers:
      en: ["what time is it", "tell me the time"]
      pl: ["która godzina", "co za godzina", "ile czasu"]
    action: query
  - name: what_can_you_do
    triggers:
      en: ["what can you do", "help me", "what are you good for"]
      pl: ["co potrafisz", "pomó(ż|z) mi", "do czego s(ł|l)u(ż|z)ysz"]
    action: query
  - name: language_pin_pl
    triggers:
      en: ["speak polish", "switch to polish"]
      pl: ["m(ó|o)w po polsku", "przejd(ź|z) na polski"]
    action: mutate
  - name: language_pin_en
    triggers:
      en: ["speak english", "switch to english"]
      pl: ["m(ó|o)w po angielsku", "przejd(ź|z) na angielski"]
    action: mutate
  - name: language_unpin
    triggers:
      en: ["detect my language", "auto language"]
      pl: ["s(ł|l)uchaj uwa(ż|z)nie", "auto j(ę|e)zyk"]
    action: mutate
  - name: stop
    triggers:
      en: ["stop", "be quiet", "shut up"]
      pl: ["stop", "cisza", "zamilcz"]
    action: mutate
  - name: news_query
    triggers:
      en: ["what's the news", "any news", "news today", "tell me the news"]
      pl: ["co w wiadomo(ś|s)ciach", "jakie s(ą|a) wiadomo(ś|s)ci", "wiadomo(ś|s)ci dnia", "co s(ł|l)ycha(ć|c) na (ś|s)wiecie"]
    action: query
  - name: remember_fact
    triggers:
      en: ["remember that", "remember"]
      pl: ["zapami(ę|e)taj (ż|z)e", "zapami(ę|e)taj, (ż|z)e", "pami(ę|e)taj (ż|z)e", "pami(ę|e)taj, (ż|z)e"]
    action: mutate
  - name: recall_fact
    triggers:
      en: ["what do you know about", "what did i tell you about", "tell me about"]
      pl: ["co wiesz o", "co pami(ę|e)tasz o", "co wiesz na temat"]
    action: query
  - name: set_reminder
    triggers:
      en: ["remind me to", "remind me that", "remind me"]
      pl: ["przypomnij mi (ż|z)e", "przypomnij mi, (ż|z)e", "przypomnij mi o", "przypomnij mi"]
    action: mutate
  - name: list_reminders
    triggers:
      en: ["what reminders", "list reminders", "any reminders"]
      pl: ["jakie mam przypomnienia", "wymie(ń|n) przypomnienia", "co mi przypomnisz"]
    action: query
  - name: cancel_reminders
    triggers:
      en: ["cancel all reminders", "clear reminders"]
      pl: ["anuluj wszystkie przypomnienia", "wyczy(ść|sc) przypomnienia"]
    action: mutate
