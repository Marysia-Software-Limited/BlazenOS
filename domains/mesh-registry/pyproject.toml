[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-registry"
version = "0.0.1"
description = "Shared loader for the constellation resource registry (configs/mesh.yaml)."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mesh_registry = ["py.typed"]
