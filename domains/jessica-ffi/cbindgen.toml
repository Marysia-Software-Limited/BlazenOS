# Header-generation policy for `jessica_ffi.h`.

language = "C"
header = "// jessica_ffi.h — generated by cbindgen. DO NOT EDIT."
include_guard = "JESSICA_FFI_H"
pragma_once = true
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true
documentation = true
style = "both"

[parse]
parse_deps = false

# JessicaMergeOutcome is only used as `i32` in extern fns, so cbindgen
# would otherwise prune the enum definition. Forcing it keeps the
# named constants visible to Swift / Kotlin consumers.
[export]
include = ["JessicaMergeOutcome"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
