[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-llm"
version = "0.0.1"
description = "Portable OpenAI-compatible client for a mesh LLM peer — call any node's advertised `llm` resource (rachel's MLX, paul's Ollama) over /v1/chat/completions, with a first-reachable resolver. Pure stdlib."
requires-python = ">=3.11"
dependencies = ["mesh-registry"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
