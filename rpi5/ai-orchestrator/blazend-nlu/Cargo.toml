[package]
workspace = "../../crates"  # workspace root lives at rpi5/crates/ (members are outside it)
name = "blazend-nlu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fast-path intent router for blazen_os: routes asr.final → nlu.intent using the shared jessica-core crate."

[[bin]]
name = "blazend-nlu"
path = "src/main.rs"

[dependencies]
blazend-ipc        = { workspace = true }
jessica-core       = { workspace = true }
tokio              = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
