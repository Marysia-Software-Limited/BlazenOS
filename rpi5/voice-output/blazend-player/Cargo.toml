[package]
workspace = "../../crates"  # workspace root lives at rpi5/crates/ (members are outside it)
name = "blazend-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Buffered stream/file audio player for blazen_os (radio + local recordings)."

[[bin]]
name = "blazend-player"
path = "src/main.rs"

[dependencies]
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
crossbeam-channel  = { workspace = true }
symphonia          = { workspace = true }
ureq               = { workspace = true }
alsa               = { workspace = true }
