id: 11-pl-voice-notes
language: pl
description: |
  Notatki głosowe w semantycznej pamięci: "nagraj notatkę" otwiera dyktowanie
  (koniec po ~1,5 s ciszy, limit 60 s), zapis to DŹWIĘK + rozpoznany TEKST
  (wav w voice_notes/ + transkrypt w memory.json + wektor e5 w sidecarze).
  Potwierdzenie czyta pierwsze słowa. "Odtwórz notatki" gra nagrania jako
  kolejkę (silnik albumowy: następny/poprzedni/stop). Wszystko lokalnie.
tags: [voice-notes, memory, semantic, pl]
synth_voice: pl_PL-gosia-medium
preconditions:
  audio.volume: 50
turns:
  - user: "hej Jessico"
    expect:
      wake_acknowledged: true
      detected_language: pl

  - user: "nagraj notatkę głosową"
    expect:
      assistant_says_contains: "jak zatytułować"   # dialog: title first
      assistant_language: pl

  - inject: "dictation: zakupy na sobotę"          # the spoken title
    expect:
      assistant_says_contains: "podyktuj treść"

  - inject: "dictation: kupić filtr do wody w sobotę"   # memo body + silence
    expect:
      assistant_says_contains: "nagrałam notatkę: zakupy na sobotę"
      memory_voice_note_saved: true      # wav + transcript + title + vector

  - user: "dżesika, odtwórz notatki"
    expect:
      player_state: playing
      player_queue_length_gt: 0

  - user: "dżesika stop"
    expect:
      player_state: stopped

postconditions:
  no_unit_restarts: true
