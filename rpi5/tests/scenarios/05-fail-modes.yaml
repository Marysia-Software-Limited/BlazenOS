id: 05-fail-modes
language: en              # turns use English; fault injection is language-agnostic
description: |
  Fault-injection scenarios. Each sub-case kills or starves one component;
  blazend-health emits a `health.status` verdict and the orchestrator drives
  the LED + a spoken recovery cue (per docs/04-VOICE-PIPELINE.md §"Failure
  handling per stage"). Polish counterpart: 05-pl-fail-modes.yaml.
tags: [resilience, watchdog, recovery, en]
preconditions:
  languages.default: en  # force English recovery cues (default is Polish)
turns:
  - inject: kill_unit
    target: blazend-brain
    expect:
      assistant_says_contains: "i'm stuck"
      led: yellow
      blazend-brain.restarts_in_60s_min: 1

  - user: "are you there"
    expect:
      wake_acknowledged: true
      assistant_reply_within_ms: 5000

  # SSH is on by default (docs/06), so recovery escalates the LED/beep
  # rather than opening the admin channel — the ssh.enabled assertions
  # that used to gate these steps are gone.
  - inject: starve_audio_in
    duration_ms: 12000
    expect:
      led: red
      assistant_says_contains: "recovery mode"

  - inject: restore_audio_in
    expect:
      led: green

  - inject: corrupt_model_file
    target: llm.qwen2.5-3b-instruct-q4_k_m.gguf
    expect:
      assistant_says_contains: "critical error"
      reboot_into_recovery_image: true
postconditions:
  unit_restart_summary_present: true
