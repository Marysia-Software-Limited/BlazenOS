[project]
name = "blazen_os"
version = "0.0.1"
description = "Voice-first Linux OS for Raspberry Pi 5 16 GB (Python + Rust)."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "rich>=13.7",
  "datamodel-code-generator>=0.25",
  "types-PyYAML>=6.0",
]
runtime = [
  # On-Pi runtime extras; installed by the image build, not for dev.
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "faster-whisper>=1.0",
  "llama-cpp-python>=0.3",
  "piper-tts>=1.2",
  # On-device note embeddings (semantic recall). Lazy-imported in
  # blazend.assistant.embeddings; absent in the test-fast venv.
  "onnxruntime>=1.17",
  "tokenizers>=0.20",
  # HAT status LEDs: APA102 over SPI0. Lazy-imported in blazend.led_hw;
  # absent in the test-fast venv (the driver degrades to a no-op without it).
  "spidev>=3.6",
]
wake-training = [
  # Build-time only: `scripts/train-wake.py` trains the Jessica wake model
  # (openWakeWord features + a Piper-synthesised dataset). Not a runtime dep —
  # the appliance ships only the resulting ONNX, run by the Rust wake unit.
  "openwakeword>=0.4",
  "torch>=2.0",
  "onnx>=1.14",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/component"]
addopts = "-ra"
pythonpath = ["src", "tests/tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src/blazend"]
explicit_package_bases = true
mypy_path = "src"

# faster-whisper is an optional runtime dep (the `runtime` extra) with no type
# stubs; it's imported lazily in blazend.asr.engine. Don't fail the strict gate
# on its absence/untyped surface.
[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true

# llama-cpp-python (the `runtime` extra) ships partial stubs and is imported
# lazily in blazend.assistant.localllm. Same treatment as faster-whisper.
[[tool.mypy.overrides]]
module = ["llama_cpp.*"]
ignore_missing_imports = true

# onnxruntime + tokenizers (the `runtime` extra) are imported lazily in
# blazend.assistant.embeddings; no/partial stubs. Don't fail the strict gate
# on their absence in the dev venv.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "tokenizers.*"]
ignore_missing_imports = true

# spidev (the `runtime` extra) is the C-extension SPI driver, imported lazily in
# blazend.led_hw; no stubs and hardware-only. Don't fail the strict gate on its
# absence in the dev venv.
[[tool.mypy.overrides]]
module = ["spidev.*"]
ignore_missing_imports = true
