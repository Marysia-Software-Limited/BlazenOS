# One shared runtime dir for the whole blazend pipeline. Created before any
# unit starts so the audio ring + IPC sockets live in a single place all
# units see. NOT a per-unit RuntimeDirectory= (that + ProtectSystem=strict
# gives each unit a PRIVATE /run/blazen, hiding the ring from its peers).
d /run/blazen 0770 blazen blazen -
# Persistent state tree — every subdir the pipeline writes, owned by the
# service user so post-flash rsyncs (music!) and unit ReadWritePaths= (tts →
# voice-cache) never hit the root-owned-dir footgun. tmpfiles runs in sysinit,
# before any blazend unit, and self-heals on every boot.
d /var/lib/blazen                0755 blazen blazen -
d /var/lib/blazen/data           0755 blazen blazen -
d /var/lib/blazen/voice-cache    0755 blazen blazen -
d /var/lib/blazen/wake-negatives 0755 blazen blazen -
d /var/lib/blazen/music          0755 blazen blazen -
d /var/lib/blazen/semantic-index 0755 blazen blazen -
d /var/lib/blazen/audiobooks     0755 blazen blazen -
d /var/lib/blazen/fabric         0755 blazen blazen -
d /var/lib/blazen/media          0755 blazen blazen -
d /var/lib/blazen/models         0755 blazen blazen -
