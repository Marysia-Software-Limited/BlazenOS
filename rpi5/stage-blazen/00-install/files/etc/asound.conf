# Blazen appliance audio routing.
#
# The Jabra SPEAK 410 (ALSA CARD=USB) is the appliance's ONLY real audio I/O —
# mic + speaker. The Pi's built-in default is HDMI (vc4hdmi), which has nothing
# attached, so any code that opens the ALSA "default" (e.g. blazend-audio-out's
# cpal fallback when its --device match misses) would play to a dead HDMI port
# and the user hears silence. Pin the default to the Jabra so a fallback can
# never land on HDMI again.
#
# Playback must ALWAYS reach the hardware at 48 kHz: the SPEAK 410 advertises
# 8/16/48 kHz playback, but its DAC clock never leaves 48 kHz — feed it a
# "natively supported" 16 kHz stream (e.g. a voice memo recorded at the ASR
# rate) and it plays 3x fast (observed 2026-08-10: an 18.9 s wav finished in
# 6.3 s via plain aplay). Rates the device does NOT advertise (22.05/44.1 kHz)
# were always fine because plug resampled them; the forced `rate 48000` slave
# below closes the 8/16 kHz hole by making plug resample those too. Capture is
# unaffected — the mic side genuinely runs at 16 kHz — so `default` is asym:
# forced-rate playback, plain plug capture.
pcm.jabra_out {
    type plug
    slave {
        pcm {
            type hw
            card USB
            device 0
        }
        rate 48000
    }
}

pcm.!default {
    type asym
    playback.pcm "jabra_out"
    capture.pcm {
        type plug
        slave.pcm {
            type hw
            card USB
            device 0
        }
    }
}

ctl.!default {
    type hw
    card USB
}
