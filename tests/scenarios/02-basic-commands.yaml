id: 02-basic-commands
language: en
description: A short turn-by-turn through the fast-path intents (no LLM).
tags: [intents, fast-path, en]
preconditions:
  audio.volume: 50
turns:
  - user: "hey Jessica"
    expect:
      wake_acknowledged: true

  - user: "what time is it"
    expect:
      assistant_intent_matches:
        intent: clock.time
      assistant_speech_duration_ms_min: 600
      assistant_speech_duration_ms_max: 4000

  - user: "set the volume to seventy percent"
    expect:
      assistant_intent_matches:
        intent: volume_set
        params:
          value: 70
      state:
        audio.volume: 70

  - user: "stop"
    expect:
      tts_interrupted: true
postconditions:
  no_unit_restarts: true
  latency_budget:
    wake_to_first_tts_ms_p95: 1000
