id: 06-pl-wake-word
language: pl
description: Polski wake word ("hej Jessico") aktywuje się i zostaje potwierdzony.
tags: [smoke, wake, pl]
preconditions:
  audio.volume: 50
  wake_word.active: [jessica_en, jessica_pl]
turns:
  - user: "hej Jessico"
    expect:
      wake_acknowledged: true
      wake_word.last_fired: jessica_pl
      detected_language: pl
      led: blue
      latency_ms_max: 250
postconditions:
  no_unit_restarts: true
  latency_budget:
    wake_to_ack_ms_p95: 300
